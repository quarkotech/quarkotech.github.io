<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Page not found — QUARKO</title>
  <meta content="The page you are looking for doesn't exist or has moved." name="description">

  <link href="assets/img/favicon.svg" rel="icon" type="image/svg+xml">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">

  <script>
    // Apply saved theme before first paint to avoid a flash
    (function () {
      var root = document.documentElement;
      var pref = "system";
      try {
        var stored = localStorage.getItem("quarko-theme");
        if (stored === "light" || stored === "dark") pref = stored;
      } catch (e) {}
      root.dataset.themePref = pref;
      var mq = window.matchMedia("(prefers-color-scheme: light)");
      function apply() {
        root.dataset.theme = pref === "system" ? (mq.matches ? "light" : "dark") : pref;
      }
      apply();
      mq.addEventListener("change", function () {
        if (root.dataset.themePref === "system") apply();
      });
    })();
  </script>

  <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>

  <main class="error-page">
    <div class="container">
      <p class="error-code grad">404</p>
      <h1>This page has decohered</h1>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a class="btn btn-primary" href="index.html">Back to home</a>
    </div>
  </main>

</body>

</html>
